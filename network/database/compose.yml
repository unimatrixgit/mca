services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: dunerealms
      POSTGRES_USER: dune_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Run setup.sh first}
      DUNE_PASSWORD: ${DUNE_PASSWORD:?Run setup.sh first}
    ports:
      - "${DB_BIND_IP:-127.0.0.1}:5432:5432"
    volumes:
      - dune_postgres:/var/lib/postgresql/data
      - ./init-app-user.sh:/docker-entrypoint-initdb.d/10-app-user.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dune_admin -d dunerealms"]
      interval: 10s
      timeout: 5s
      retries: 6
volumes:
  dune_postgres:
