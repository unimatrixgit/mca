name: Network configuration preflight
on:
  push:
    paths:
      - 'network/**'
      - 'DuneTerrain/src/main/resources/config.yml'
      - '.github/workflows/network-preflight.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check inventory and build world config ZIPs
        run: python3 network/preflight.py --check-worlds
      - name: Simulate 1000 chunks of planetary ore attempts
        run: python3 network/simulate-ores.py
      - name: Upload world configuration packages
        uses: actions/upload-artifact@v4
        with:
          name: dune-world-configs
          path: network/generated-worlds/*-world-config.zip
