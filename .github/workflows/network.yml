name: Package DuneRealms Velocity Network
on:
  workflow_dispatch:
  push:
    branches: [main, "feature/native-gui-1.21.8"]
    paths:
      - 'network/**'
      - 'gui-common/**'
      - 'tools/**'
      - 'DuneLobby/**'
      - 'DuneTerrain/**'
      - 'DuneEss/**'
      - 'DuneNPC/**'
      - 'DuneRealms-minecraft-only/**'
      - '.github/workflows/network.yml'
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - name: Build plugins
        run: |
          set -e
          mkdir -p built-plugins
          for project in DuneRealms-minecraft-only DuneTerrain DuneNPC DuneEss DuneLobby; do
            (cd "$project" && gradle clean build)
          done
          cp DuneRealms-minecraft-only/build/libs/*.jar built-plugins/DuneCore.jar
          cp DuneTerrain/build/libs/*.jar built-plugins/DuneTerrain.jar
          cp DuneNPC/build/libs/*.jar built-plugins/DuneNPC.jar
          cp DuneEss/build/libs/*.jar built-plugins/DuneRealms-Essentials.jar
          cp DuneLobby/build/libs/*.jar built-plugins/DuneLobby.jar
      - name: Download verified crossplay plugins
        run: |
          python3 tools/download-crossplay.py built-crossplay
          curl --fail --location --silent --show-error https://github.com/Foulest/Vault/releases/download/2.5.0/Vault-2.5.0.jar --output built-crossplay/universal/Vault-2.5.0.jar
          echo "3efb1c893d35807c0f3945068858a96af0f131020eee37545bdddb330044b2d9  built-crossplay/universal/Vault-2.5.0.jar" | sha256sum --check --strict
          curl --fail --location --silent --show-error https://raw.githubusercontent.com/Foulest/Vault/2.5.0/LICENSE --output built-crossplay/Vault-LICENSE.txt
      - name: Package six servers and Velocity config
        run: python3 network/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: DuneRealms-Velocity-Network
          path: DuneRealms-Velocity-Network.zip
          if-no-files-found: error
