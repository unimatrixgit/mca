name: DuneItems
version: 1.0.5
main: com.example.duneitems.DuneItems
api-version: '1.21.4'
softdepend: [DuneCore, DuneMenus]
authors: [DuneRealms]
description: Original DuneRealms crafting items
commands:
  duneitems:
    description: Give an original DuneRealms item
    usage: /duneitems offices | give <player> <water_vial|smugglers_water_vial> [count]
permissions:
  duneitems.admin:
    description: Give DuneRealms custom items
    default: op
