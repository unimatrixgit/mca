# Set false when installing alongside the planet servers to preserve their join routing.
join-at-lobby: true
respawn-at-lobby: true
world: guild_lobby
# Used only when DuneEss is absent. No fare is charged by the lobby.
servers:
  arrakis: arrakis
  caladan: caladan
  giedi_prime: giedi-prime
  kaitain: kaitain
  sigma_draconis_iv: sigma-draconis-iv
# Barter is self contained and does not create Solaris or counterfeit DuneCore tags.
water-price-emeralds: 4
spice-price-emeralds: 8
rules:
  - Respect other travellers and staff.
  - No griefing, stealing, exploits or cheating.
  - Keep chat welcoming. No harassment or spam.
  - Follow the server's faction and trading rules.
  - Ask staff before building outside authorised areas.
news:
  - Welcome to the Vaerkring.
  - Five planetary departures are available in the starport.
  - Official trade is in the Exchange. Discreet trade is down the side passage.
  - These are lobby notices; configure live news separately.
