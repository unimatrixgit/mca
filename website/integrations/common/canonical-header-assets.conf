# Include inside each native community HTTPS server block.
# Native pages keep same-origin CSP while fetching the canonical website header assets.
location = /dune-navigation.js {
 proxy_pass http://127.0.0.1:3000/portal-navigation.js;
 proxy_set_header Host www.dunerealms.com;
 proxy_hide_header Cache-Control;
 add_header Cache-Control "no-store" always;
 add_header X-Content-Type-Options nosniff always;
}
location = /dune-navigation.css {
 proxy_pass http://127.0.0.1:3000/portal-navigation.css;
 proxy_set_header Host www.dunerealms.com;
 proxy_hide_header Cache-Control;
 add_header Cache-Control "no-store" always;
 add_header X-Content-Type-Options nosniff always;
}
