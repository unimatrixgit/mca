# Set this separately on each Paper backend. When this is the primary world,
# register both its generator and biome-provider in bukkit.yml as documented.
# Accepted values: arrakis, giedi_prime, kaitain, caladan, sigma_draconis_iv
server:
  planet: arrakis

# Guild Navigator settings are now managed by DuneNPC/config.yml.

sietches:
  enabled: true
  spacing: 2000
  # Only desert sietches generate. Rock/highland sites remain disabled.
  highlands:
    enabled: false
    frequency-multiplier: 3
    minimum-per-region: 3

spice-blow:
  enabled: true
  spacing: 2000
  radius: 24
  target-value: 15000
  unit-price: 15

spice-deposits:
  per-chunk: 2
  patches:
    enabled: true
    region-spacing: 600
    chance-per-region: 0.35
    radius: 12
    target-value: 5000
    unit-price: 15

planets:
  arrakis:
    enabled: true
    spawn: {x: 0, z: 0}
    terrain: {base-height: 70, height-variation: 11, noise-scale: 0.02}
    biome: DESERT
    surface: SAND
    filler: RED_SAND
    water: {level: 63, swamp-pools: false, coverage: 0.18}
    vegetation: {trees: false, tree-chance: 0.0, flowers-per-chunk: 0}
    oasis-trees: {enabled: true, spacing: 300, trunk-height: 7}
    # Server datapack registers this biome; absent pack safely uses DESERT climate.
    # Highlands share the irregular rock footprint and have three upper terraces.
    highlands: {enabled: true, biome: 'dunerealms:dune-highlands', mountain-rise: 32, spire-height: 40, min-spacing: 300, max-spacing: 500}
    # Legacy spacing/enabled below are superseded by highlands settings.
    # Upper terraces are hard capped at 3 levels and 5 blocks between levels.
    # Broad overlapping ridges use a 65-90 block base radius.
    darkstone-islands: {enabled: true, spacing: 750, min-radius: 65, max-radius: 90, max-height: 14, max-plateaus: 3, plateau-interval: 5}
    # Arrakis: spice only, no mineable ores.
    ores: {min-y: -48, max-y: 48, vein-size: 5}
  giedi_prime:
    enabled: true
    spawn: {x: 0, z: 0}
    terrain: {base-height: 61, height-variation: 5, noise-scale: 0.02}
    biome: SWAMP
    surface: DIRT
    filler: BLACKSTONE
    water: {level: 63, swamp-pools: true, coverage: 0.18}
    vegetation: {trees: true, tree-chance: 0.006, flowers-per-chunk: 0}
    # Giedi Prime: Harkonnen heavy industry.
    ores: {min-y: -48, max-y: 48, vein-size: 6, COAL_ORE: 22, IRON_ORE: 20, COPPER_ORE: 14, REDSTONE_ORE: 10, ANCIENT_DEBRIS: 5}
    # Diamond-like deep Overworld distribution; debris only on Giedi Prime.
    ancient-debris: {min-y: -59, max-y: 16, vein-size: 5}
  kaitain:
    enabled: true
    spawn: {x: 0, z: 0}
    terrain: {base-height: 70, height-variation: 3, noise-scale: 0.02}
    biome: PLAINS
    surface: GRASS_BLOCK
    filler: DIRT
    water: {level: 0, swamp-pools: false, coverage: 0.18}
    vegetation: {trees: true, tree-chance: 0.018, flowers-per-chunk: 64}
    # Kaitain: imperial precious minerals.
    ores: {min-y: -48, max-y: 48, vein-size: 4, GOLD_ORE: 16, EMERALD_ORE: 12, DIAMOND_ORE: 7, LAPIS_ORE: 7}
  caladan:
    enabled: true
    spawn: {x: 0, z: 0}
    terrain: {base-height: 67, height-variation: 10, noise-scale: 0.02}
    biome: JUNGLE
    surface: GRASS_BLOCK
    filler: DIRT
    water: {level: 72, swamp-pools: true, coverage: 0.55}
    vegetation: {trees: true, tree-chance: 0.035, flowers-per-chunk: 0}
    # Caladan: modest industrial minerals.
    ores: {min-y: -48, max-y: 48, vein-size: 5, COAL_ORE: 7, IRON_ORE: 8, COPPER_ORE: 12, LAPIS_ORE: 5}
  sigma_draconis_iv:
    enabled: true
    spawn: {x: 0, z: 0}
    terrain: {base-height: 72, height-variation: 14, noise-scale: 0.02}
    biome: SNOWY_PLAINS
    surface: SNOW_BLOCK
    filler: DEEPSLATE
    water: {level: 0, swamp-pools: false, coverage: 0.18}
    vegetation: {trees: false, tree-chance: 0.0, flowers-per-chunk: 0}
    # Sigma Draconis IV: harsh frontier mining.
    ores: {min-y: -48, max-y: 48, vein-size: 5, IRON_ORE: 11, COPPER_ORE: 6, REDSTONE_ORE: 12, DIAMOND_ORE: 5}

# One finite 30 x 30 rich patch per 512-block region; new Arrakis chunks only.
dense-spice:
  enabled: true
  spacing: 512
  yield: 4

# Custom sandstone houses; no farms or hay. Shared finite chest loot.
desert-villages:
  enabled: true
  spacing: 768

# Java desert-well-style attempt rate (1 per 1000 chunks), subject to terrain checks.
harkonnen-fortress:
  enabled: true
  rarity: 1000
